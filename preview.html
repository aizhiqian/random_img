<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源在线预览</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            height: 100%;
            max-width: 1400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            color: #333;
            padding: 20px;
            margin: 0;
            font-size: 2.2em;
            flex-shrink: 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding: 15px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            flex-shrink: 0;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        select, button {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .preview-area img,
        .preview-area video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            object-fit: contain;
            position: absolute;
        }

        .preview-area img.hidden,
        .preview-area video.hidden {
            visibility: hidden;
        }

        .loading {
            font-size: 1.2em;
            color: #667eea;
            display: none;
            position: absolute;
        }

        .loading.active {
            display: block;
        }

        .info {
            padding: 15px 30px;
            background: white;
            border-top: 1px solid #e9ecef;
            text-align: center;
            display: none;
            flex-shrink: 0;
        }

        .info.active {
            display: block;
        }

        .info p {
            margin: 5px 0;
            color: #555;
            font-size: 14px;
        }

        .info a {
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
        }

        .info a:hover {
            text-decoration: underline;
        }

        .error {
            color: #dc3545;
            padding: 15px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            display: none;
            position: absolute;
            max-width: 80%;
        }

        .error.active {
            display: block;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.6em;
                padding: 15px;
            }

            .controls {
                flex-direction: column;
                padding: 10px 15px;
                gap: 10px;
            }

            .control-group {
                width: 100%;
            }

            .control-group label {
                min-width: 80px;
            }

            .control-group select,
            .control-group button {
                flex: 1;
            }

            .info {
                padding: 10px 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 资源在线预览</h1>

        <div class="controls">
            <div class="control-group">
                <label for="resourceType">资源类型:</label>
                <select id="resourceType">
                    <option value="image">图片</option>
                    <option value="video">视频</option>
                </select>
            </div>

            <div class="control-group">
                <label for="category">分类:</label>
                <select id="category">
                    <option value="">加载中...</option>
                </select>
            </div>

            <button onclick="loadResource()">🎲 随机加载</button>
        </div>

        <div class="preview-area" id="previewArea">
            <div class="loading" id="loading">加载中...</div>
            <div class="error" id="error"></div>
            <img id="previewImage" class="hidden" alt="预览图片">
            <video id="previewVideo" class="hidden" controls></video>
        </div>

        <div class="info" id="info"></div>
    </div>

    <script>
        let currentResource = null;

        // 获取媒体元素引用
        const previewImage = document.getElementById('previewImage');
        const previewVideo = document.getElementById('previewVideo');

        // 页面加载时初始化
        window.onload = function() {
            loadCategories();
            document.getElementById('resourceType').addEventListener('change', loadCategories);

            // 绑定错误处理
            previewImage.onerror = () => showError('图片加载失败');
            previewVideo.onerror = () => showError('视频加载失败');
        };

        // 加载分类列表
        async function loadCategories() {
            const type = document.getElementById('resourceType').value;
            const categorySelect = document.getElementById('category');

            try {
                const response = await fetch(`/api/categories/${type}`);
                const data = await response.json();

                categorySelect.innerHTML = '<option value="">全部</option>';
                data.categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    categorySelect.appendChild(option);
                });
            } catch (error) {
                showError('加载分类失败: ' + error.message);
            }
        }

        // 加载资源
        async function loadResource() {
            const type = document.getElementById('resourceType').value;
            const category = document.getElementById('category').value;

            showLoading(true);
            hideError();
            hideInfo();

            // 隐藏当前媒体
            previewImage.classList.add('hidden');
            previewVideo.classList.add('hidden');

            try {
                const url = `/api/random/${type}?category=${category}`;
                const response = await fetch(url);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.message);
                }

                currentResource = {url: data.url, category: data.category};
                displayResource();
            } catch (error) {
                showError('加载失败: ' + error.message);
                showLoading(false);
            }
        }

        // 显示资源
        function displayResource() {
            if (!currentResource) return;

            const type = document.getElementById('resourceType').value;

            // 暂停视频
            previewVideo.pause();

            // 隐藏所有媒体元素
            previewImage.classList.add('hidden');
            previewVideo.classList.add('hidden');

            // 更新对应元素的 src 并显示
            if (type === 'image') {
                previewImage.onload = () => {
                    previewImage.classList.remove('hidden');
                    showLoading(false);
                };
                previewImage.src = currentResource.url;
            } else {
                previewVideo.onloadeddata = () => {
                    previewVideo.classList.remove('hidden');
                    showLoading(false);
                };
                previewVideo.src = currentResource.url;
                previewVideo.load();
                previewVideo.play();
            }

            // 显示信息
            showInfo();
        }

        // 显示信息
        function showInfo() {
            const info = document.getElementById('info');
            info.innerHTML = `
                <p><strong>分类:</strong> ${currentResource.category}</p>
                <p><strong>链接:</strong> <a href="${currentResource.url}" target="_blank">${currentResource.url}</a></p>
            `;
            info.classList.add('active');
        }

        function hideInfo() {
            document.getElementById('info').classList.remove('active');
        }

        // 显示/隐藏加载状态
        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (loading) {
                if (show) {
                    loading.classList.add('active');
                } else {
                    loading.classList.remove('active');
                }
            }
        }

        // 显示错误
        function showError(message) {
            const error = document.getElementById('error');
            if (error) {
                error.textContent = message;
                error.classList.add('active');
            }
        }

        function hideError() {
            const error = document.getElementById('error');
            if (error) {
                error.classList.remove('active');
            }
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'r' || e.key === 'n' || e.key === 'ArrowRight') {
                e.preventDefault();
                loadResource();
            }
        });
    </script>
</body>
</html>
